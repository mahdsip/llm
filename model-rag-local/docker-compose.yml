services:
  qdrant:
    container_name: qdrant
    build:
      context: .
      dockerfile: qdrant.Dockerfile
    image: rag-qdrant:1.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY__DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/collections >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  ragapi:
    container_name: ragapi
    build:
      context: ./ragapi
      dockerfile: Dockerfile
    image: rag-ragapi:1.0
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DOCS_DIR: /data/docs
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_documents
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      LLM_MODEL: llama3.1:8b
      CHUNK_SIZE: "768"
      CHUNK_OVERLAP: "100"
      TOP_K: "6"
      RAG_DISABLE_SLIDE_CAPTIONING: "true"
      STATE_DIR: /data/state
      LOG_LEVEL: INFO
    volumes:
      - ${DOCUMENTS_DIR_HOST:?Set DOCUMENTS_DIR_HOST in .env}:/data/docs:ro
      - ./state:/data/state
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  agentsvc:
    container_name: agentsvc
    build:
      context: ./agentsvc
      dockerfile: Dockerfile
    image: rag-agentsvc:1.0
    restart: unless-stopped
    depends_on:
      ragapi:
        condition: service_healthy
    environment:
      RAG_API_BASE: http://ragapi:8000
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: llama3.1:8b
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 15s

  openwebui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:
      agentsvc:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3000:8080"

volumes:
  ollama_models:
