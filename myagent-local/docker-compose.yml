services:

  # ---- Qdrant (RAG backend) -----------------------------------------
  # Requerido si usas --rag (myagent --rag).
  # Arrancar con: docker compose --profile optional up qdrant
  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    profiles: [optional]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__TELEMETRY__DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/collections >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  # ---- Open WebUI (interfaz web opcional) ---------------------------
  # UI web opcional para chatear con Ollama sin terminal.
  # Arrancar con: docker compose --profile optional up openwebui
  openwebui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    profiles: [optional]
    ports:
      - "3000:3000"

volumes:
  qdrant_storage:
